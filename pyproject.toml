[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "video-harness"
version = "0.1.0"
description = "Local transcript-first video production workflow for Codex"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
video-harness = "video_harness.__main__:main"

[tool.setuptools.packages.find]
include = ["video_harness*"]
