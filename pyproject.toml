[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "video-harness"
version = "0.2.0"
description = "Local transcript-first video production workflow for Codex"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
video-harness = "video_harness.__main__:main"

[tool.setuptools.packages.find]
include = ["video_harness*"]

[project.optional-dependencies]
media = ["Pillow>=11,<14"]
transcribe = ["Pillow>=11,<14", "faster-whisper>=1.2.1,<2"]

[tool.setuptools.package-data]
"video_harness.media_backend" = ["scripts/*.py", "assets/*.json", "LICENSE"]
